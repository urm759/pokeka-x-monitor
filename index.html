<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>トレカ買取相場一覧</title>
  <meta name="description" content="トレカバンクとトレカラウンジのポケモンカードPSA10を画像つきで見やすく並べ、30日分の掲載日数を蓄積するページ。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237dd3fc'/%3E%3Cstop offset='1' stop-color='%2334d399'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%23070c17'/%3E%3Crect x='11' y='11' width='42' height='42' rx='12' fill='url(%23g)'/%3E%3Cpath d='M21 22h22v6H21zm0 10h22v6H21zm0 10h14v6H21z' fill='white' opacity='.96'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="backdrop backdrop-a"></div>
  <div class="backdrop backdrop-b"></div>
  <main class="shell">
    <header class="hero">
      <div class="eyebrow">torecabank / torecalounge / pokemon / psa10</div>
      <div class="hero-grid">
        <div>
          <h1>トレカ買取相場一覧</h1>
          <p class="lede">
            トレカバンクとトレカラウンジのポケモンカードPSA10をまとめて見比べながら、サイト別の掲載数と30日蓄積をひと目で確認できます。
            みんなのトレカ相場のカード画像にも照合して、元カード側の確認もしやすくしています。
          </p>
        </div>
        <div class="hero-card">
          <div class="hero-card-label">取得元</div>
          <strong id="sourceUrl">-</strong>
          <p id="statsLine">-</p>
        </div>
      </div>
      <div class="stats">
        <article class="stat"><span>総件数</span><strong id="totalCount">0</strong></article>
        <article class="stat"><span>照合率</span><strong id="matchRate">0%</strong></article>
        <article class="stat"><span>平均価格</span><strong id="avgPrice">-</strong></article>
        <article class="stat"><span>取得日</span><strong id="updatedAt">-</strong></article>
      </div>
      <div class="source-summary" id="sourceSummary"></div>
    </header>

    <section class="controls">
      <label class="field">
        <span>サイト</span>
        <select id="source"></select>
      </label>
      <label class="field field-wide">
        <span>検索</span>
        <input id="query" type="search" placeholder="カード名 / 型番 / 価格 / 商品ID" />
      </label>
      <label class="field">
        <span>価格 下限</span>
        <input id="priceMin" type="number" min="0" step="1000" placeholder="0" />
      </label>
      <label class="field">
        <span>価格 上限</span>
        <input id="priceMax" type="number" min="0" step="1000" placeholder="未指定" />
      </label>
      <label class="field">
        <span>並び順</span>
        <select id="sort">
          <option value="price-desc">価格の高い順</option>
          <option value="price-asc">価格の低い順</option>
          <option value="name-asc">カード名の昇順</option>
          <option value="name-desc">カード名の降順</option>
          <option value="page-desc">ページ番号の降順</option>
          <option value="match-desc">照合スコアの高い順</option>
        </select>
      </label>
    </section>

    <section class="content">
      <div class="card-list" id="items"></div>
    </section>
  </main>

  <script src="./data/toreca-catalog-cards.js"></script>
  <script src="./data/torecabank-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
