<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>トレカバンク PSA10 一覧</title>
  <meta name="description" content="トレカバンクの郵送買取一覧から、ポケモンカードのPSA10を画像つきで見やすく並べ、30日分の掲載日数を蓄積するページ。" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="backdrop backdrop-a"></div>
  <div class="backdrop backdrop-b"></div>
  <main class="shell">
    <header class="hero">
      <div class="eyebrow">torecabank / pokemon / psa10</div>
      <div class="hero-grid">
        <div>
          <h1>トレカバンク PSA10 一覧</h1>
          <p class="lede">
            郵送買取一覧からポケモンカードのPSA10だけを集めて、画像・価格・掲載日数をひと目で比較できるようにしています。
            みんなのトレカ相場のカード画像にも照合して、元カード側の確認もしやすくしています。
          </p>
        </div>
        <div class="hero-card">
          <div class="hero-card-label">取得元</div>
          <strong id="sourceUrl">-</strong>
          <p id="statsLine">-</p>
        </div>
      </div>
      <div class="stats">
        <article class="stat"><span>総件数</span><strong id="totalCount">0</strong></article>
        <article class="stat"><span>照合率</span><strong id="matchRate">0%</strong></article>
        <article class="stat"><span>平均価格</span><strong id="avgPrice">-</strong></article>
        <article class="stat"><span>取得日</span><strong id="updatedAt">-</strong></article>
      </div>
    </header>

    <section class="controls">
      <label class="field field-wide">
        <span>検索</span>
        <input id="query" type="search" placeholder="カード名 / 型番 / 価格 / 商品ID" />
      </label>
      <label class="field">
        <span>価格 下限</span>
        <input id="priceMin" type="number" min="0" step="1000" placeholder="0" />
      </label>
      <label class="field">
        <span>価格 上限</span>
        <input id="priceMax" type="number" min="0" step="1000" placeholder="未指定" />
      </label>
      <label class="field">
        <span>並び順</span>
        <select id="sort">
          <option value="price-desc">価格の高い順</option>
          <option value="price-asc">価格の低い順</option>
          <option value="name-asc">カード名の昇順</option>
          <option value="name-desc">カード名の降順</option>
          <option value="page-desc">ページ番号の降順</option>
          <option value="match-desc">照合スコアの高い順</option>
        </select>
      </label>
    </section>

    <section class="content">
      <div class="card-list" id="items"></div>
    </section>
  </main>

  <script src="../toreca-catalog/data/cards.js"></script>
  <script src="./data/torecabank-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
