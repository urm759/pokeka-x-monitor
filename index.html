<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mist 買取シート切り出しビューア</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">MIST SHEET REVIEW</p>
          <h1>画像分析・切り分け確認</h1>
          <p class="sub">固定グリッドで切り出したカード画像と価格欄をまとめて確認できます。</p>
        </div>
        <div class="stats">
          <div><span>枚数</span><strong id="cellCount">-</strong></div>
          <div><span>解像度</span><strong id="imageSize">-</strong></div>
          <div><span>認識済</span><strong id="recognizedCount">-</strong></div>
        </div>
      </header>

      <section class="toolbar">
        <label>
          表示
          <select id="mode">
            <option value="cell">セル全体</option>
            <option value="card">カード部分</option>
            <option value="price">価格部分</option>
          </select>
        </label>
        <label>
          検索
          <input id="query" type="search" placeholder="カード名・番号・行・列" />
        </label>
      </section>

      <section id="grid" class="grid"></section>
    </main>
    <script src="./manifest.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
